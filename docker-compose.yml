services:

  loadbalancer:
    image: nginx:latest
    container_name: loadbalancer

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    networks:
      - public_subnet
      - private_subnet

    depends_on:
      - backend1
      - backend2

  backend1:
    build: ./backend
    container_name: backend1

    expose:
      - "3000"

    networks:
      - private_subnet

  backend2:
    build: ./backend
    container_name: backend2

    expose:
      - "3000"

    networks:
      - private_subnet

networks:

  public_subnet:

  private_subnet:
